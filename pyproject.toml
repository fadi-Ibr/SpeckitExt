[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speckitext"
version = "1.0.0"
description = "Traceability-aware planning preset tooling and deterministic task/batch-scoped context compiler for GitHub Spec Kit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
speckitext = "speckitext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
