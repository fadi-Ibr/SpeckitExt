schema_version: "1.0"

preset:
  id: "traceability"
  name: "SpeckitExt Traceability"
  version: "1.1.1"
  description: "Traceability-aware planning: stable IDs, typed relationships, governance applicability, and scoped implementation context"
  author: "SpeckitExt"
  repository: "https://github.com/fadi-Ibr/SpeckitExt"
  license: "MIT"

requires:
  speckit_version: ">=0.9.0"

provides:
  templates:
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Structured constitution with CON-xxx rules and GLOBAL/SCOPED/CONDITIONAL applicability"
      replaces: "constitution-template"
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Specification template with FR/SC IDs and governed_by links"
      replaces: "spec-template"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Plan template with DEC/COMP/CTR/DM IDs and typed relationships"
      replaces: "plan-template"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Tasks template with Txxx tasks carrying satisfies/implements/verified_by links"
      replaces: "tasks-template"
    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Author constitution rules with stable CON-xxx IDs and applicability metadata"
      strategy: "wrap"
      replaces: "speckit.constitution"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Author requirements with governed_by traceability"
      strategy: "wrap"
      replaces: "speckit.specify"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Clarify while preserving IDs and relationships"
      strategy: "wrap"
      replaces: "speckit.clarify"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Plan with decisions, components, contracts and traceability links"
      strategy: "wrap"
      replaces: "speckit.plan"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Generate linked tasks and run the traceability validation gate"
      strategy: "wrap"
      replaces: "speckit.tasks"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Analyze with graph validation and impact analysis"
      strategy: "wrap"
      replaces: "speckit.analyze"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Implement from a deterministic scoped context package, never broad artifacts"
      replaces: "speckit.implement"

tags:
  - "traceability"
  - "context"
  - "planning"
